services:
  postgres:
    image: postgres:16
    container_name: traceai_v2_postgres
    environment:
      POSTGRES_DB: traceai
      POSTGRES_USER: traceai
      POSTGRES_PASSWORD: traceai
    ports:
      - "5434:5432"
    volumes:
      - traceai_v2_postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: traceai_v2_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - traceai_v2_qdrant_data:/qdrant/storage

volumes:
  traceai_v2_postgres_data:
  traceai_v2_qdrant_data:
